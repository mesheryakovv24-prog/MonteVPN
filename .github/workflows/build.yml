name: Build MonteVPN (APK & Windows)

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build-android:
    name: Build Android APK
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          cache: true

      - name: Generate Android scaffold
        run: |
          mkdir -p /tmp/fresh
          cd /tmp/fresh
          flutter create scaffold_app --platforms=android --org com.montevpn
          cd -
          cp -r /tmp/fresh/scaffold_app/android/gradle android/
          cp /tmp/fresh/scaffold_app/android/gradlew android/
          cp /tmp/fresh/scaffold_app/android/gradlew.bat android/
          cp /tmp/fresh/scaffold_app/android/build.gradle android/
          cp /tmp/fresh/scaffold_app/android/settings.gradle android/
          cp /tmp/fresh/scaffold_app/android/app/build.gradle android/app/
          sed -i 's/minSdkVersion .*/minSdkVersion 24/' android/app/build.gradle || true
          sed -i 's/minSdk = .*/minSdk = 24/' android/app/build.gradle || true

      - name: Install dependencies
        run: flutter pub get

      - name: Build Android APK
        run: flutter build apk --release

      - name: Rename APK
        run: mv build/app/outputs/flutter-apk/app-release.apk build/app/outputs/flutter-apk/MonteVPN.apk

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: MonteVPN-Android-APK
          path: build/app/outputs/flutter-apk/MonteVPN.apk

      - name: Create Release
        uses: softprops/action-gh-release@v2
        if: startsWith(github.ref, 'refs/tags/') || github.ref == 'refs/heads/main'
        with:
          tag_name: "v1.0.${{ github.run_number }}"
          name: "MonteVPN Release v1.0.${{ github.run_number }}"
          draft: false
          prerelease: false
          files: build/app/outputs/flutter-apk/MonteVPN.apk
