name: Build MonteVPN (APK & Windows)

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build-android:
    name: Build Android APK
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          cache: true

      - name: Build Android APK
        run: |
          set -e

          # 1. Backup custom Android manifest & kotlin files
          mkdir -p /tmp/backup
          cp android/app/src/main/AndroidManifest.xml /tmp/backup/AndroidManifest.xml
          cp -r android/app/src/main/kotlin /tmp/backup/kotlin

          # 2. Generate a pristine official Flutter Android scaffold
          flutter create /tmp/fresh_app --org com.montevpn --project-name monte_vpn

          # 3. Replace local android folder with the complete official scaffold
          rm -rf android
          cp -r /tmp/fresh_app/android .

          # 4. Inject our custom AndroidManifest and Kotlin files
          cp /tmp/backup/AndroidManifest.xml android/app/src/main/AndroidManifest.xml
          cp -r /tmp/backup/kotlin android/app/src/main/

          # 5. Set minSdk 24, targetSdk 33, compileSdk 34 for V2Ray VPNService
          find android -name "build.gradle*" -exec sed -i 's/minSdkVersion .*/minSdkVersion 24/' {} + || true
          find android -name "build.gradle*" -exec sed -i 's/minSdk = .*/minSdk = 24/' {} + || true
          find android -name "build.gradle*" -exec sed -i 's/targetSdkVersion .*/targetSdkVersion 33/' {} + || true
          find android -name "build.gradle*" -exec sed -i 's/targetSdk = .*/targetSdk = 33/' {} + || true
          find android -name "build.gradle*" -exec sed -i 's/compileSdkVersion .*/compileSdkVersion 34/' {} + || true
          find android -name "build.gradle*" -exec sed -i 's/compileSdk = .*/compileSdk = 34/' {} + || true
          echo "android.bundle.enableUncompressedNativeLibs=false" >> android/gradle.properties

          # 6. Fetch dependencies and build release APK
          flutter pub get
          flutter build apk --release

          # 7. Make APK available in workspace root
          mkdir -p $GITHUB_WORKSPACE/build/app/outputs/flutter-apk
          cp build/app/outputs/flutter-apk/app-release.apk $GITHUB_WORKSPACE/build/app/outputs/flutter-apk/MonteVPN.apk

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: MonteVPN-Android-APK
          path: build/app/outputs/flutter-apk/MonteVPN.apk

      - name: Create Release
        uses: softprops/action-gh-release@v2
        if: startsWith(github.ref, 'refs/tags/') || github.ref == 'refs/heads/main'
        with:
          tag_name: "v1.0.${{ github.run_number }}"
          name: "MonteVPN Release v1.0.${{ github.run_number }}"
          draft: false
          prerelease: false
          files: build/app/outputs/flutter-apk/MonteVPN.apk
